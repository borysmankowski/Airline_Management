spring:
  application:
    name: Airline-management

  datasource:
    url: jdbc:h2:mem:airline;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: sa

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

airline:
  jwt:
    secret: ${JWT_SECRET:dev-secret-dev-secret-dev-secret-123456}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  admin:
    email: ${ADMIN_EMAIL:admin@test.com}
    password: ${ADMIN_PASSWORD:Admin1234}

