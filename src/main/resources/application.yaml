server:
  port: 8080

spring:
  application:
    name: Airline-management

  datasource:
    url: jdbc:postgresql://localhost:5432/airline-management
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true