spring:
  application:
    name: Airline-management

  datasource:
    url: jdbc:h2:mem:airline;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: sa

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console